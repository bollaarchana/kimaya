<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="900"
  viewBox="0 0 1200 900"
>
  <defs>
    <linearGradient
      id="bgGradient"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="100%"
    >
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F7F4FD" />
    </linearGradient>
  </defs>

  <rect
    width="1200"
    height="900"
    fill="url(#bgGradient)"
  />

  <g
    stroke="#6D3FD1"
    stroke-width="1"
    opacity="0.08"
    fill="none"
  >

    <!-- Vertical Curves -->
    <path d="M-250 900C150 700 150 200-250 0" />
    <path d="M-170 900C230 700 230 200-170 0" />
    <path d="M-90 900C310 700 310 200-90 0" />
    <path d="M-10 900C390 700 390 200-10 0" />
    <path d="M70 900C470 700 470 200 70 0" />
    <path d="M150 900C550 700 550 200 150 0" />
    <path d="M230 900C630 700 630 200 230 0" />
    <path d="M310 900C710 700 710 200 310 0" />
    <path d="M390 900C790 700 790 200 390 0" />
    <path d="M470 900C870 700 870 200 470 0" />
    <path d="M550 900C950 700 950 200 550 0" />

    <!-- Horizontal Curves -->
    <path d="M0-200C250 100 950 100 1200-200" />
    <path d="M0-120C250 180 950 180 1200-120" />
    <path d="M0-40C250 260 950 260 1200-40" />
    <path d="M0 40C250 340 950 340 1200 40" />
    <path d="M0 120C250 420 950 420 1200 120" />
    <path d="M0 200C250 500 950 500 1200 200" />
    <path d="M0 280C250 580 950 580 1200 280" />
    <path d="M0 360C250 660 950 660 1200 360" />
    <path d="M0 440C250 740 950 740 1200 440" />

  </g>
</svg>