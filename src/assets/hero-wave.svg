<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 1600 180"
    preserveAspectRatio="none">

    <!-- Purple Base -->
    <path
        d="M0,160
           C250,120 420,70 700,110
           C980,150 1200,180 1600,70
           L1600,180
           L0,180 Z"
        fill="#2D1663"/>

    <!-- White Curve -->
    <path
        d="M0,145
           C250,105 420,55 700,95
           C980,135 1200,165 1600,55"
        fill="none"
        stroke="#ffffff"
        stroke-width="5"
        stroke-linecap="round"/>

    <!-- Orange Curve -->
    <path
        d="M0,150
           C250,110 420,60 700,100
           C980,140 1200,170 1600,60"
        fill="none"
        stroke="#F47C20"
        stroke-width="7"
        stroke-linecap="round"/>

</svg>